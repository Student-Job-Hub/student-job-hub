<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <title>Student Job Hub — Find Campus Jobs, Services & Opportunities</title>
    <meta name="description" content="Student Job Hub connects university students with jobs, freelance services, and campus opportunities. Post jobs, apply for positions, and offer your skills — all in one platform." />
    <meta name="keywords" content="student jobs, campus jobs, university jobs, student services, freelance, part-time jobs, student employment, campus opportunities" />
    <meta name="author" content="Student Job Hub" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://studentjobhub.com/" />

    <!-- Open Graph Tags (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Student Job Hub — Find Campus Jobs & Services" />
    <meta property="og:description" content="Connect with campus job opportunities, offer services, and grow your career as a student. Join Student Job Hub today." />
    <meta property="og:url" content="https://studentjobhub.com/" />
    <meta property="og:site_name" content="Student Job Hub" />
    <meta property="og:image" content="https://studentjobhub.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Student Job Hub Logo" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Student Job Hub — Find Campus Jobs & Services" />
    <meta name="twitter:description" content="Connect with campus job opportunities, offer services, and grow your career. Join Student Job Hub today." />
    <meta name="twitter:image" content="https://studentjobhub.com/og-image.png" />
    <meta name="twitter:image:alt" content="Student Job Hub Logo" />

    <!-- Theme & App Metadata -->
    <meta name="theme-color" content="#2563eb" />
    <meta name="application-name" content="Student Job Hub" />

    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="StudentJobHub.Client.styles.css" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <script type="importmap"></script>

    <!-- Structured Data (JSON-LD) for search engines -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Student Job Hub",
        "description": "A platform connecting university students with jobs, freelance services, and campus opportunities.",
        "url": "https://studentjobhub.com/",
        "applicationCategory": "EmploymentAgency",
        "operatingSystem": "Web",
        "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
        },
        "author": {
            "@type": "Organization",
            "name": "Student Job Hub Team"
        }
    }
    </script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="js/authStorage.js"></script>
    <script src="js/seo.js"></script>
    <script src="js/fileDownload.js"></script>

    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    
</body>

</html>
